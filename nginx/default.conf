# 统一入口：/ → web:3000，/em-api/* → em-api:8787（去掉前缀）
# 供局域网直接访问 http://<服务器IP>:8088，也可作为未来隧道/反向代理的后端
#
# 注意：upstream 用服务名而非固定 IP。Docker 内嵌 DNS 为 127.0.0.11，
# 显式配置 resolver + 变量形式的 proxy_pass 才能按 TTL 动态解析，
# 避免容器 recreate 换 IP 后 nginx 仍连旧地址导致 502。
server {
    listen 80;
    server_name _;

    client_max_body_size 10m;
    resolver 127.0.0.11 valid=10s ipv6=off;

    location /em-api/ {
        set $em_api_upstream "em-api:8787";
        # 剥离 /em-api 前缀，与前端 NEXT_PUBLIC_EM_API_URL=/em-api 的约定一致
        rewrite ^/em-api/(.*)$ /$1 break;
        proxy_pass http://$em_api_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # 同步服务允许跨域（浏览器也可能直连它）
        add_header Access-Control-Allow-Origin $http_origin always;
        add_header Access-Control-Allow-Methods "GET, POST, DELETE, OPTIONS" always;
        add_header Access-Control-Allow-Headers "Content-Type" always;
        if ($request_method = OPTIONS) {
            return 204;
        }
    }

    location / {
        set $web_upstream "web:3000";
        proxy_pass http://$web_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # NDJSON 流式行情需要禁用缓冲
        proxy_buffering off;
        proxy_cache off;
    }
}
